name: Projection Lambda Tests

on:
  pull_request:
    branches:
      - master
    paths:
      - 'TruckVisitManagement.Projection.Lambda/**'
      - 'TruckVisitManagement.Projection.Lambda.Tests/**'
      - 'TruckVisitManagement.Domain/**'
      - 'TruckVisitManagement.Infrastructure/**'
      - '.github/workflows/projection-lambda-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore test project
        run: dotnet restore TruckVisitManagement.Projection.Lambda.Tests/TruckVisitManagement.Projection.Lambda.Tests.csproj

      - name: Build test project
        run: dotnet build TruckVisitManagement.Projection.Lambda.Tests/TruckVisitManagement.Projection.Lambda.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TruckVisitManagement.Projection.Lambda.Tests/TruckVisitManagement.Projection.Lambda.Tests.csproj --configuration Release --no-build --verbosity normal
