name: Api Build

on:
  pull_request:
    branches:
      - master
    paths:
      - 'TruckVisitManagement.Api/**'
      - 'TruckVisitManagement.Api.Tests/**'
      - 'TruckVisitManagement.Domain.Tests/**'
      - 'TruckVisitManagement.Application.Commands/**'
      - 'TruckVisitManagement.Application.Queries/**'
      - 'TruckVisitManagement.Domain/**'
      - 'TruckVisitManagement.Infrastructure/**'
      - 'TruckVisitManagement.slnx'
      - '.github/workflows/api-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API project
        run: dotnet restore TruckVisitManagement.Api/TruckVisitManagement.Api.csproj

      - name: Build API project
        run: dotnet build TruckVisitManagement.Api/TruckVisitManagement.Api.csproj --configuration Release --no-restore

      - name: Restore API business tests
        run: dotnet restore TruckVisitManagement.Api.Tests/TruckVisitManagement.Api.Tests.csproj

      - name: Build API business tests
        run: dotnet build TruckVisitManagement.Api.Tests/TruckVisitManagement.Api.Tests.csproj --configuration Release --no-restore

      - name: Run API business tests
        id: run_business_tests
        continue-on-error: true
        run: dotnet test TruckVisitManagement.Api.Tests/TruckVisitManagement.Api.Tests.csproj --configuration Release --no-build

      - name: Warn on failing business tests
        if: steps.run_business_tests.outcome == 'failure'
        run: echo "::warning::API business tests failed. Workflow is configured to continue for now."

      - name: Restore domain tests
        run: dotnet restore TruckVisitManagement.Domain.Tests/TruckVisitManagement.Domain.Tests.csproj

      - name: Build domain tests
        run: dotnet build TruckVisitManagement.Domain.Tests/TruckVisitManagement.Domain.Tests.csproj --configuration Release --no-restore

      - name: Run domain tests
        run: dotnet test TruckVisitManagement.Domain.Tests/TruckVisitManagement.Domain.Tests.csproj --configuration Release --no-build
