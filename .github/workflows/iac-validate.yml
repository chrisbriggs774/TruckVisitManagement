name: IaC Validate

on:
  pull_request:
    branches:
      - master
    paths:
      - 'deployment/**'
      - '.github/workflows/iac-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Setup Terragrunt
        run: |
          TERRAGRUNT_VERSION=0.67.16
          curl -fsSL -o terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive deployment/terraform

      - name: Validate OpenTofu module
        working-directory: deployment/terraform
        run: |
          tofu init -backend=false
          tofu validate

      - name: Check Terragrunt formatting
        run: terragrunt hclfmt --check --working-dir deployment/terragrunt

      - name: Validate Terragrunt inputs
        run: terragrunt run-all validate-inputs --terragrunt-non-interactive --working-dir deployment/terragrunt
